name: Backend CI/CD

on: 
  push:
    branches: ["release*", "main"]
  pull_request:
    branches: ["main"]
jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar os testes
        run: npm test

      - name: Build da imagem Docker
        run: docker build -t musiki-api:ci backend

      - name: Salvar imagem em arquivo tar
        run: docker save musiki-api:ci -o imagem-backend.tar

      - name: Upload do artefato da imagem
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-backend
          path: imagem-backend.
  cd:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefato da imagem
        uses: actions/download-artifact@v4
        with:
          name: docker-image-backend

      - name: Carregar imagem no Docker
        run: docker load -i imagem-backend.tar

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Enviar imagem para o Docker Hub
        run: |
          docker tag musiki-api:ci ${{ secrets.DOCKERHUB_USERNAME }}/musiki-api:latest
          docker tag musiki-api:ci ${{ secrets.DOCKERHUB_USERNAME }}/musiki-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/musiki-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/musiki-api:${{ github.sha }}